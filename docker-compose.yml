version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: bhu_tattva_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bhu_tattva_db}
      POSTGRES_USER: ${POSTGRES_USER:-bhu_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bhu_secure_pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bhu_admin} -d ${POSTGRES_DB:-bhu_tattva_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: bhu_tattva_neo4j
    restart: always
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-bhu_graph_pass}
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bhu_tattva_backend
    restart: always
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-bhu_tattva_db}
      - POSTGRES_USER=${POSTGRES_USER:-bhu_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-bhu_secure_pass}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-bhu_graph_pass}
      - APP_MODE=${APP_MODE:-development}
      - DATA_MODE=${DATA_MODE:-mock}
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bhu_tattva_frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  neo4j_data:
